name: CI/CD Pipeline for Expo with EAS Build

on:
  # push:
  #   branches:
  #     - main  
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Node.js (Set up the required Node.js version)
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22.4.0'  # Change this to the version you need

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Install EAS CLI
      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install Expo CLI
        run: npm install -g expo-cli

      - name: Check Expo token (Debugging)
        run: echo ${{ secrets.EXPO_ACCESS_TOKEN }}

      # # Step 5: Log in to Expo (You will need to set up Expo authentication using GitHub Secrets)
      # - name: EAS login
      #   run: eas login --token ${{ secrets.EXPO_ACCESS_TOKEN }}  # Use the Expo token from GitHub secrets
      - name: 🏗 Setup Expo and EAS
        uses: expo/expo-github-action@v7
        with:
          token: ${{ secrets.EXPO_ACCESS_TOKEN }}  # Use the Expo token from GitHub secrets
          expo-version: latest
          eas-version: latest

      - name: EAS init
        run: eas init --non-interactive --force

      # Step 6: Run EAS Build (for Android and iOS)
      - name: EAS Build (Android)
        run: eas build --platform android --profile production --non-interactive

      - name: EAS Build (iOS)
        run: eas build --platform ios --profile production --non-interactive

      # # Step 7: Optionally, upload the build artifacts to GitHub for future use (e.g., deploy or store)
      # - name: Upload build artifacts
      #   uses: actions/upload-artifact@v2
      #   with:
      #     name: expo-build-artifacts
      #     path: ./apk/*.apk   # path to where our build artifacts are stored, like APK 

      # # Step 8: Optionally, notify if the build fails or succeeds (Slack, email, etc.)
      # - name: Notify Build Success (Optional)
      #   run: echo "Build was successful!"  # Here, you can integrate notifications like Slack if needed
